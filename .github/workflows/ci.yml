name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev-py312.lock
      - name: Install hash-locked development dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev-py312.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest
      - name: Check doctests with explicit expected statistical warning
        run: >-
          python -m pytest --no-cov --doctest-modules src/curvefit_stats examples
          -W 'default:Bound-active parameter rows:UserWarning'
      - run: python examples/workflows.py

  distributions:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev-py312.lock
      - run: python -m pip install --require-hashes -r requirements/dev-py312.lock
      - name: Build wheel from source distribution and validate archives
        run: |
          python -m build
          python -m twine check --strict dist/*
          python tools/check_distributions.py
      - name: Validate direct sdist installation in a clean runtime environment
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip check
          "$RUNNER_TEMP/sdist-env/bin/python" -I tools/check_install.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  compatibility:
    needs: distributions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            numpy: '1.26.4'
            scipy: '1.12.0'
          - os: ubuntu-latest
            python: '3.12'
            numpy: '1.26.4'
            scipy: '1.12.0'
          - os: ubuntu-latest
            python: '3.12'
            numpy: '2.5.4'
            scipy: '1.18.1'
          - os: ubuntu-latest
            python: '3.13'
            numpy: '2.5.4'
            scipy: '1.18.1'
          - os: ubuntu-latest
            python: '3.14'
            numpy: '2.5.4'
            scipy: '1.18.1'
          - os: windows-latest
            python: '3.12'
            numpy: '2.5.4'
            scipy: '1.18.1'
          - os: macos-latest
            python: '3.12'
            numpy: '2.5.4'
            scipy: '1.18.1'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Install built wheel and explicit numerical stack
        run: |
          wheel=(dist/*.whl)
          python -m pip install "${wheel[0]}[test]" 'numpy==${{ matrix.numpy }}' 'scipy==${{ matrix.scipy }}'
          python -m pip check
      - run: python -I tools/check_install.py
      - run: python -m pytest
      - name: Check installed-package and scientific-model doctests
        run: |
          package=$(python -c 'import pathlib, curvefit_stats; print(pathlib.Path(curvefit_stats.__file__).parent)')
          python -m pytest -c pyproject.toml --no-cov --doctest-modules "$package" examples -W 'default:Bound-active parameter rows:UserWarning'
      - run: python examples/workflows.py
