name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag and main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main

          # Only release commits reachable from main.
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release tag must point to a commit in main history."
            exit 1
          }

          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]

          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Invalid release tag: {tag}")

          with open("pyproject.toml", "rb") as file:
              project = tomllib.load(file)["project"]

          if tag != f"v{project['version']}":
              raise SystemExit(
                  f"Tag {tag} does not match version {project['version']}"
              )

          print(f"Releasing {project['name']} {project['version']}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install \
            --require-hashes \
            -r requirements/dev-py312.lock

          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run quality checks
        run: |
          ruff check .
          ruff format --check .
          mypy
          python -m pytest

          python -m pytest \
            --no-cov \
            --doctest-modules \
            src/curvefit_stats examples \
            -W 'default:Bound-active parameter rows:UserWarning'

          python examples/workflows.py

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          python tools/check_distributions.py

          test "$(find dist -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/curvefit-stats/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2


  github-release:
    name: Create GitHub Release
    needs: pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; updating distribution assets."
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "curvefit-stats $RELEASE_TAG" \
              --generate-notes \
              --latest
          fi

          gh release view "$RELEASE_TAG"