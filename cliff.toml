
# git-cliff configuration for curvefit-stats
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to `curvefit-stats` are documented here.

This project follows [Semantic Versioning](https://semver.org/).

<!-- git-cliff: end of header -->
"""

body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/bibymaths/curvefit-stats/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/bibymaths/curvefit-stats/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""

footer = """
<!-- Generated by git-cliff -->
"""

trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
filter_commits = false

tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"

sort_commits = "oldest"
topo_order = false

commit_parsers = [
    { message = "^feat(\\(.+\\))?!?:", group = "Features" },
    { message = "^fix(\\(.+\\))?!?:", group = "Bug Fixes" },
    { message = "^perf(\\(.+\\))?!?:", group = "Performance" },
    { message = "^refactor(\\(.+\\))?!?:", group = "Refactoring" },
    { message = "^docs?(\\(.+\\))?!?:", group = "Documentation" },
    { message = "^test(\\(.+\\))?!?:", group = "Testing" },
    { message = "^build(\\(.+\\))?!?:", group = "Build System" },
    { message = "^ci(\\(.+\\))?!?:", group = "Continuous Integration" },
    { message = "^chore(\\(.+\\))?!?:", group = "Maintenance" },
    { message = "^style(\\(.+\\))?!?:", group = "Maintenance" },
    { message = "^revert", group = "Reverts" },
    { message = ".*", group = "Other Changes" },
]

[remote.github]
owner = "bibymaths"
repo = "curvefit-stats"