[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "curvefit-stats"
version = "0.1.0"
description = "Statistical inference, shared-parameter fitting, and errors-in-variables regression for SciPy models"
readme = "README.md"
requires-python = ">=3.11"
# Compatibility note:
# scipy.odr is deprecated as of SciPy 1.17 and removed in SciPy 1.19.
# curvefit-stats currently uses scipy.odr for errors-in-variables regression
# through eiv_curve_fit. Therefore, SciPy is restricted to versions <1.19.
# Maintainers: Do not remove this upper bound until eiv_curve_fit has been
# migrated to a supported ODR backend and its numerical compatibility tests pass.
# Users: Python >=3.11 is supported, but SciPy 1.19+ is not yet compatible.
license = "MIT"
license-files = [
    "LICENSE",
    "LICENSE-DOCS.md",
    "THIRD_PARTY_NOTICES.md",
]
authors = [
    { name = "Abhinav Mishra", email = "mishraabhinav36@gmail.com" }
]
maintainers = [
    { name = "Abhinav Mishra", email = "mishraabhinav36@gmail.com" }
]
keywords = ["curve-fitting", "statistics", "uncertainty", "nonlinear-regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26.4,<3", "scipy>=1.12,<1.19"]

[project.urls]
Repository = "https://github.com/bibymaths/curvefit-stats"
Issues = "https://github.com/bibymaths/curvefit-stats/issues"
Documentation = "https://github.com/bibymaths/curvefit-stats/blob/main/docs/user-guide.md"

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-cov==7.1.0"]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "scipy-stubs==1.18.1.1",
    "build==1.2.2.post1",
    "twine==6.1.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["curvefit_stats"]
namespaces = false

[tool.setuptools.package-data]
curvefit_stats = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "examples/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples", "tools"]
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --cov=curvefit_stats --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["curvefit_stats"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 90
